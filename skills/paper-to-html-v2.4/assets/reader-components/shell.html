<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>论文共读组件</title><link rel="stylesheet" href="reader.css"></head><body data-paper-id="replace-with-unique-paper-id"><nav aria-label="正文目录" id="reader-nav"></nav><main id="reader-content"><!--由论文内容替换：section[data-section]与稳定id；图文面板按components.md生成--></main>
<button class="reader-return" hidden="" id="reader-return">↩ 回到刚才阅读处</button>
<div class="reader-dock"><div class="reader-dock-row"><button aria-expanded="false" aria-label="展开荧光笔" id="reader-pen">✏️</button><div class="reader-tools" hidden="" id="reader-pen-tools"><button aria-pressed="false" id="reader-pen-enable">开启</button><button id="reader-undo">撤销</button></div><button aria-expanded="true" id="reader-legend-toggle">图例</button></div><div class="reader-legend" id="reader-legend"><button aria-pressed="true" id="reader-color-toggle">术语彩色：开启</button><div class="reader-legend-grid"><span class="term-gene-protein">基因与蛋白</span><span class="term-method">实验方法</span><span class="term-regulatory">调控元件</span><span class="term-cell-type">细胞与亚型</span><span class="term-concept">生物学概念</span></div></div></div>
<button aria-expanded="false" class="reader-notes-toggle" id="reader-notes-toggle">随手记</button><aside class="reader-notes" hidden="" id="reader-notes"><h2>随手记 · 随手问</h2><p class="reader-status">问题保存到当前论文项目，下轮共读时处理。</p><select aria-hidden="true" aria-label="放在哪一块" hidden="" id="reader-note-section"></select><textarea aria-label="问题或要求" id="reader-draft" placeholder="想到什么就写什么，可粘贴截图"></textarea><div id="reader-attachments"></div><button disabled="" id="reader-note-save">存下这条 · 下轮处理</button><p class="reader-status" id="reader-note-status" role="status"></p><div id="reader-note-list"></div></aside>
<dialog aria-label="论文图片预览" class="reader-zoom" id="reader-zoom"><div class="reader-zoom-tools"><button aria-label="放大图片" id="reader-zoom-plus">＋</button><button aria-label="缩小图片" id="reader-zoom-minus">−</button><button id="reader-zoom-reset">复位</button></div><button aria-label="关闭图片预览" id="reader-zoom-close" title="关闭图片预览">×</button><div class="reader-zoom-stage" id="reader-zoom-stage"><img alt="当前放大图" id="reader-zoom-image"/></div></dialog><script src="reader.js"></script></body></html>
